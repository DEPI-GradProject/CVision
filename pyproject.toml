[project]
name = "cvision"
version = "0.2.0"
description = "AI-powered CV-to-Job matching platform with LangGraph agents and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "psycopg2-binary>=2.9.9",
    "arxiv>=3.0.0",
    "chromadb>=1.5.0,<2.0.0",
    "faiss-cpu>=1.13.2",
    "langchain>=1.2.17",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.3",
    "langchain-google-genai>=4.2.2",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.2.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.1.10",
    "langgraph-cli[inmem]>=0.4.25",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0,<1.0.0",
    "alembic>=1.18.4",
    "sentry-sdk>=2.0.0",
    "slowapi>=0.1.9",
    "fastapi-users[sqlalchemy]>=15.0.0",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.4.1",
    "wikipedia>=1.4.0",
]

[tool.setuptools.packages.find]
include = ["api*", "agents*", "auth*", "graph*", "models*", "scrapers*", "utils*", "config*", "alembic*"]
exclude = ["frontend*", "Data*"]

[project.optional-dependencies]
nlp = ["spacy>=3.8.14"]
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "pytest-asyncio>=0.24.0", "aiosqlite>=0.20.0", "mypy>=1.15.0"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["*.ipynb", ".venv", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["frontend/", "Data/", "tests/", "alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
