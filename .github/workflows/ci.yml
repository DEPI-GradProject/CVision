name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: "."

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit hooks
        run: SKIP=ruff,ruff-format pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=api --cov=auth --cov=models --cov=utils --cov=agents --cov=config --cov=graph --cov-report=term-missing --cov-fail-under=60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Type check
        run: npx tsc -b --noEmit
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install mypy
      - name: Run mypy
        run: mypy .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project & pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --desc --no-deps

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t cvision-api .
      - name: Build Frontend image
        run: docker build -t cvision-frontend -f frontend/Dockerfile frontend/
      - name: Prepare env file
        run: cp .env.example .env
      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api
      - name: Smoke test
        run: |
          sleep 5
          curl -f --retry 10 --retry-delay 3 http://localhost:8000/api/v1/health

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t cvision-api .
      - name: Build Frontend image
        run: docker build -t cvision-frontend -f frontend/Dockerfile frontend/
      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "cvision-api"
          format: "sarif"
          output: "trivy-api.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
      - name: Scan Frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "cvision-frontend"
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-api.sarif
